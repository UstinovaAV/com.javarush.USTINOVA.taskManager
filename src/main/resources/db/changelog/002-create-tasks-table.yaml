databaseChangeLog:
  - changeSet:
      id: 002-create-tasks-table
      author: Ustinova
      changes:
        - createTable:
            tableName: tasks
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: deadline
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
        # внешний клюк
        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: user_id
            constraintName: fk_task_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE