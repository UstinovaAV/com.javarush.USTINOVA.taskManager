databaseChangeLog:
  - changeSet:
      id: 003-add-soft-delete-to-users
      author: Ustinova
      comment: Добавление полей для мягкого удаления (soft delete) пользователей
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: timestamp